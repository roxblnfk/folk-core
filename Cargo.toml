[workspace]
resolver = "2"
members = [
    "crates/folk-core",
    "crates/folk-ext",
    "folk",
]

[workspace.package]
version = "0.1.18"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Folk Contributors"]
repository = "https://github.com/Folk-Project/folk-core"
homepage = "https://github.com/Folk-Project"
keywords = ["folk", "php", "server", "async"]
categories = ["asynchronous", "web-programming"]

[workspace.dependencies]
# core async + io
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
async-trait = "0.1"
futures-util = { version = "0.3", features = ["sink"] }
bytes = "1"

# protocol
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
rmpv = { version = "1", features = ["with-serde"] }

# config + cli
figment = { version = "0.10", features = ["toml", "env"] }
clap = { version = "4", features = ["derive"] }

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# errors
anyhow = "1"
thiserror = "2"

# metrics (only used in metrics plugin, but version pinned here for consistency)
prometheus = { version = "0.13", features = ["process"] }

# platform
libc = "0.2"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# allow some pedantic lints that are noisy without adding safety:
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
