[workspace]
resolver = "2"
members = [
    "crates/folk-core",
    "crates/folk-ext",
]

[workspace.package]
version = "0.3.8"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Folk Contributors"]
repository = "https://github.com/Folk-Project/folk-core"
homepage = "https://github.com/Folk-Project"
keywords = ["folk", "php", "server", "async"]
categories = ["asynchronous", "web-programming"]

[workspace.dependencies]
# core async + io
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures-util = { version = "0.3", features = ["sink"] }
bytes = "1"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# request ids (UUID v7 — time-ordered, globally unique)
uuid = { version = "1", features = ["v7"] }

# config
figment = { version = "0.10", features = ["toml", "env"] }

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# errors
anyhow = "1"
thiserror = "2"

# metrics (only used in metrics plugin, but version pinned here for consistency)
prometheus = { version = "0.13", features = ["process"] }

# platform
libc = "0.2"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# allow some pedantic lints that are noisy without adding safety:
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
