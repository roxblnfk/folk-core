[package]
name = "folk-core"
description = "Server core for Folk PHP application server — worker pool, plugin registry, admin RPC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
# folk-api is a separate repository. Once published, switch to:
#   folk-api = "0.1.1"
# For now, using local path during initial development.
folk-api = "0.1.1"
folk-protocol = { version = "0.1.1", path = "../folk-protocol" }

tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rmpv = { workspace = true }
rmp-serde = { workspace = true }
figment = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
prometheus = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
humantime-serde = "1"

[dev-dependencies]
tempfile = "3"
